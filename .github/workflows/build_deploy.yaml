name: Build and Deploy to GitHub Pages

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: SetUp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: "scripts/scraper/yarn.lock"

      - name: Install scraper dependencies
        working-directory: ./scripts/scraper
        run: yarn install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: ./scripts/scraper
        run: yarn playwright install --with-deps

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      
      - name: Clone Kubernetes website repo
        run: git clone -b main --single-branch https://github.com/kubernetes/website.git ./k8s-repo/website

      - name: Run data collection scripts
        working-directory: ./scripts
        run: |
          chmod +x ./collect_all_files.sh
          ./collect_all_files.sh

      - name: Run scraper
        working-directory: ./scripts/scraper
        run: yarn run scrape

      - name: Build Go application
        run: |
          mkdir -p ./bin
          go build -o ./bin/fetch-history ./cmd/fetch-history/main.go
          go build -o ./bin/analyze ./cmd/analyze/main.go

      - name: Fetch Git History (commits)
        run: |
          ./bin/fetch-history --repo ./k8s-repo/website --output ./data/master/git_history.jsonl

      - name: Analyze Git History
        env:
          KUBERNETES_WEBSITE_READ_GITHUB_TOKEN: ${{ secrets.KUBERNETES_WEBSITE_READ_GITHUB_TOKEN }}
        run: ./bin/analyze

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: "web/yarn.lock"

      - name: Install frontend dependencies
        working-directory: ./web
        run: yarn install --frozen-lockfile

      - name: Set deploy datetime
        id: datetime
        run: |
          echo "datetime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build frontend
        working-directory: ./web
        env:
          NODE_ENV: production
          VITE_DEPLOY_TIMESTAMP: ${{ steps.datetime.outputs.timestamp }}
          VITE_GIT_SHA: ${{ github.sha }}
        run: yarn build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment files
        run: |
          mkdir -p _site
          cp -a web/dist/. _site/
          mkdir -p _site/data
          cp -r data/output/* _site/data/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
